<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">Vertical testimonial video placeholder</title>
  <desc id="desc">A dark FORDIVINE placeholder for a future 9 by 16 client testimonial video.</desc>
  <defs>
    <radialGradient id="glow" cx="28%" cy="18%" r="84%">
      <stop offset="0" stop-color="#5a554b"/>
      <stop offset="0.45" stop-color="#2d2f2e"/>
      <stop offset="1" stop-color="#171717"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8dfc8"/>
      <stop offset="1" stop-color="#b7a687"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1600" fill="url(#glow)"/>
  <rect x="54" y="54" width="792" height="1492" rx="44" fill="none" stroke="#e8dfc8" stroke-opacity="0.18" stroke-width="3"/>
  <g transform="translate(450 700)">
    <circle r="104" fill="#ffffff" fill-opacity="0.10" stroke="#e8dfc8" stroke-opacity="0.68" stroke-width="4"/>
    <path d="M-24-44L58 0-24 44Z" fill="url(#gold)"/>
  </g>
  <text x="450" y="900" fill="#e8dfc8" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" letter-spacing="7" text-anchor="middle">CLIENT STORY</text>
  <text x="450" y="958" fill="#ffffff" fill-opacity="0.55" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" text-anchor="middle">9:16 VIDEO PLACEHOLDER</text>
  <line x1="300" y1="1035" x2="600" y2="1035" stroke="#e8dfc8" stroke-opacity="0.42" stroke-width="2"/>
  <text x="450" y="1435" fill="#ffffff" fill-opacity="0.36" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="3" text-anchor="middle">FORDIVINE™</text>
</svg>
